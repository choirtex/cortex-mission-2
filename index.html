<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CORTEX — Mission 2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=21" />
  </head>
  <body>
    <div class="slide">
      <img id="bg-a" class="layer-bg on" src="assets/slide-1/layer-bg.png?v=19" alt="" />
      <img id="bg-b" class="layer-bg" alt="" />
      <div class="panel" id="panel">
        <img id="layer-frame" class="layer-frame" alt="CORTEX frame" />
        <img id="layer-title" class="layer-title" alt="Mission title" />
        <section class="quest" id="quest" hidden>
          <p class="quest-kicker" id="quest-kicker"></p>
          <h2 class="quest-title" id="quest-title"></h2>
          <p class="quest-flavor" id="quest-flavor"></p>
          <div class="quest-body" id="quest-body"></div>
        </section>
        <button id="back" class="nav-btn nav-back" type="button" disabled>BACK</button>
        <button id="continue" class="continue-btn" type="button" aria-label="Continue">
          <span class="continue-face">
            <img id="layer-btn" alt="" />
          </span>
        </button>
        <button id="next" class="nav-btn nav-next" type="button" disabled>NEXT</button>
      </div>
    </div>
    <div id="veil" class="veil on"></div>
    <script src="lessons.js?v=21"></script>
    <script src="main.js?v=23"></script>
  </body>
</html>
